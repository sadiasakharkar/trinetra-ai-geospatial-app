services:
  - type: web
    name: trinetra-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRINETRA_MODEL_URL
        sync: false
      - key: TRINETRA_MODEL_SHA256
        sync: false
      - key: TRINETRA_LOG_LEVEL
        value: INFO
