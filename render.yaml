services:
  - type: web
    name: trinetra-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TRINETRA_MODEL_URL
        sync: false
      - key: TRINETRA_MODEL_SHA256
        value: 5e8b662c72064318e92c9f2ace817cbb68821515dcca3b8083ece6c0d78ee015
      - key: TRINETRA_LOG_LEVEL
        value: INFO
